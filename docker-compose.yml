# Personal database platform: one PostgreSQL, one database + one Directus per app,
# and a Cloudflare Tunnel that publishes each app's Directus on its own hostname
# (fam-api.xgold.tech, ai-api.xgold.tech, …) without opening a single router port. The bare
# fam.xgold.tech / ai.xgold.tech names stay the apps' front-ends (GitHub Pages today). Single-level
# names on purpose: the free Universal SSL certificate covers *.xgold.tech only.
#
#   PostgreSQL        127.0.0.1:5432 only — never reachable from the LAN, the tailnet or
#                     the internet. Apps and browsers talk to Directus, never to Postgres.
#   directus          the owner's personal database UI, Tailscale-only (port 8055)
#   directus-<app>    one per app, bound to 127.0.0.1:805x so only the tunnel and the
#                     dashboard can reach it
#   twenty-server/-worker + redis   the Twenty CRM at crm.<domain>, 127.0.0.1:3020 (§ 5.8)
#   cloudflared       outbound-only connection to Cloudflare, on the HOST network so it can
#                     reach every loopback-only listener (Directuses, later the dashboard);
#                     hostnames → 127.0.0.1:<port> are configured in Zero Trust (SERVER_SETUP § 5)
#
# The dashboard itself runs natively (see SERVER_SETUP.md), not in this stack.
#
# [INSTALLER] This stack is NEW infrastructure. Check first: (1) nothing else on the
# server uses ports 5432, 8055-8057, 3020, 2000 (`ss -ltnp`); (2) the pinned image tags are still
# current (postgres:16, directus/directus:11.9.3 were current in Oct 2026; cloudflared
# tracks `latest` on purpose — Cloudflare retires old clients). Container names must match
# the dashboard env (DIRECTUS_CONTAINER, POSTGRES_CONTAINER, APP_<NAME>_CONTAINER,
# CLOUDFLARED_CONTAINER). To add an app: scripts/add-app.sh <name> prints the block to paste.

services:
  postgres:
    image: postgres:16
    container_name: homelab-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # read by deploy/postgres-init/01-apps.sh on FIRST start only (empty data dir)
      APPS: ${APPS}
      APP_FAM_DB_PASSWORD: ${APP_FAM_DB_PASSWORD}
      APP_AI_DB_PASSWORD: ${APP_AI_DB_PASSWORD}
      APP_CRM_DB_PASSWORD: ${APP_CRM_DB_PASSWORD}
    volumes:
      # [INSTALLER] keep the data OUTSIDE the source checkout, e.g. PGDATA_DIR=/srv/homelab/pgdata
      - ${PGDATA_DIR:-./pgdata}:/var/lib/postgresql/data
      - ./deploy/postgres-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- the owner's personal database UI: Tailscale only, not in the tunnel --------------
  directus:
    image: directus/directus:11.9.3
    container_name: homelab-directus
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SECRET: ${DIRECTUS_SECRET}
      DB_CLIENT: pg
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      ADMIN_EMAIL: ${DIRECTUS_ADMIN_EMAIL}
      ADMIN_PASSWORD: ${DIRECTUS_ADMIN_PASSWORD}
      PUBLIC_URL: ${DIRECTUS_PUBLIC_URL}
      TELEMETRY: "false"
    volumes:
      - ${APPS_DATA_DIR:-./apps}/personal/uploads:/directus/uploads
      - ${APPS_DATA_DIR:-./apps}/personal/extensions:/directus/extensions
    ports:
      # reachable over the tailnet (ufw limits 8055 to tailscale0, SERVER_SETUP § 8)
      - "8055:8055"

  # ---- one Directus per public app: own database, own users, own admin, own hostname -----
  directus-fam:
    image: directus/directus:11.9.3
    container_name: homelab-directus-fam
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SECRET: ${APP_FAM_SECRET}
      DB_CLIENT: pg
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: fam
      DB_USER: fam
      DB_PASSWORD: ${APP_FAM_DB_PASSWORD}
      ADMIN_EMAIL: ${APP_FAM_ADMIN_EMAIL}
      ADMIN_PASSWORD: ${APP_FAM_ADMIN_PASSWORD}
      PUBLIC_URL: https://fam-api.${PUBLIC_DOMAIN}
      # behind Cloudflare: trust the proxy for client IPs, rate-limit, secure cookies. CORS allows the
      # app's SITE origin (its front-end at fam.<domain>); the admin UI is same-origin and needs nothing.
      IP_TRUST_PROXY: "loopback,linklocal,uniquelocal"
      ACCESS_TOKEN_TTL: "15m"
      REFRESH_TOKEN_TTL: "7d"
      SESSION_COOKIE_TTL: "1d"
      HSTS_ENABLED: "true"
      RATE_LIMITER_ENABLED: "true"
      RATE_LIMITER_POINTS: "50"
      RATE_LIMITER_DURATION: "1"
      CORS_ENABLED: "true"
      CORS_ORIGIN: ${APP_FAM_CORS_ORIGIN:-https://fam.${PUBLIC_DOMAIN}}
      REFRESH_TOKEN_COOKIE_SECURE: "true"
      REFRESH_TOKEN_COOKIE_SAME_SITE: lax
      SESSION_COOKIE_SECURE: "true"
      SESSION_COOKIE_SAME_SITE: lax
      WEBSOCKETS_ENABLED: "true"
      TELEMETRY: "false"
    volumes:
      - ${APPS_DATA_DIR:-./apps}/fam/uploads:/directus/uploads
      - ${APPS_DATA_DIR:-./apps}/fam/extensions:/directus/extensions
    ports:
      # loopback only: the tunnel (host network) and the dashboard both reach it at 127.0.0.1:8056
      - "127.0.0.1:8056:8055"

  directus-ai:
    image: directus/directus:11.9.3
    container_name: homelab-directus-ai
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SECRET: ${APP_AI_SECRET}
      DB_CLIENT: pg
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ai
      DB_USER: ai
      DB_PASSWORD: ${APP_AI_DB_PASSWORD}
      ADMIN_EMAIL: ${APP_AI_ADMIN_EMAIL}
      ADMIN_PASSWORD: ${APP_AI_ADMIN_PASSWORD}
      PUBLIC_URL: https://ai-api.${PUBLIC_DOMAIN}
      IP_TRUST_PROXY: "loopback,linklocal,uniquelocal"
      ACCESS_TOKEN_TTL: "15m"
      REFRESH_TOKEN_TTL: "7d"
      SESSION_COOKIE_TTL: "1d"
      HSTS_ENABLED: "true"
      RATE_LIMITER_ENABLED: "true"
      RATE_LIMITER_POINTS: "50"
      RATE_LIMITER_DURATION: "1"
      CORS_ENABLED: "true"
      CORS_ORIGIN: ${APP_AI_CORS_ORIGIN:-https://ai.${PUBLIC_DOMAIN}}
      REFRESH_TOKEN_COOKIE_SECURE: "true"
      REFRESH_TOKEN_COOKIE_SAME_SITE: lax
      SESSION_COOKIE_SECURE: "true"
      SESSION_COOKIE_SAME_SITE: lax
      WEBSOCKETS_ENABLED: "true"
      TELEMETRY: "false"
    volumes:
      - ${APPS_DATA_DIR:-./apps}/ai/uploads:/directus/uploads
      - ${APPS_DATA_DIR:-./apps}/ai/extensions:/directus/extensions
    ports:
      - "127.0.0.1:8057:8055"

  # ---- Twenty CRM (crm.<domain>): the self-hosted CRM for several people -----------------
  # Same Postgres (its own database + role "crm", created by 01-apps.sh / add-app.sh), its own
  # Redis, two containers from one image (server + worker), files under APPS_DATA_DIR/crm.
  # Published by the tunnel as https://crm.<domain> → http://127.0.0.1:3020; Cloudflare Access
  # (allow-listed e-mails) sits in front, Twenty's own accounts behind it (SERVER_SETUP § 5.8).
  # [INSTALLER] Twenty wants ~2 GB RAM for itself (free -h). Pin TWENTY_TAG to a release.
  redis:
    image: redis:7-alpine
    container_name: homelab-redis
    restart: unless-stopped
    command: ["redis-server", "--maxmemory-policy", "noeviction", "--save", "60", "1"]
    volumes:
      - ${APPS_DATA_DIR:-./apps}/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    # no ports: only the Twenty containers on the compose network use it

  twenty-server:
    image: twentycrm/twenty:${TWENTY_TAG:-latest}
    container_name: homelab-twenty
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_PORT: 3000
      # the password is pasted into this URL unencoded: hex only (openssl rand -hex 32)
      PG_DATABASE_URL: postgres://crm:${APP_CRM_DB_PASSWORD}@postgres:5432/crm
      SERVER_URL: https://crm.${PUBLIC_DOMAIN}
      REDIS_URL: redis://redis:6379
      ENCRYPTION_KEY: ${APP_CRM_ENCRYPTION_KEY}
      STORAGE_TYPE: local
      DISABLE_DB_MIGRATIONS: "false"
      DISABLE_CRON_JOBS_REGISTRATION: "false"
      # outbound e-mail for invites and password resets (optional; empty = none)
      EMAIL_DRIVER: ${TWENTY_EMAIL_DRIVER:-}
      EMAIL_SMTP_HOST: ${TWENTY_EMAIL_SMTP_HOST:-}
      EMAIL_SMTP_PORT: ${TWENTY_EMAIL_SMTP_PORT:-}
      EMAIL_SMTP_USER: ${TWENTY_EMAIL_SMTP_USER:-}
      EMAIL_SMTP_PASSWORD: ${TWENTY_EMAIL_SMTP_PASSWORD:-}
      EMAIL_FROM_ADDRESS: ${TWENTY_EMAIL_FROM_ADDRESS:-}
      EMAIL_FROM_NAME: ${TWENTY_EMAIL_FROM_NAME:-Twenty CRM}
    volumes:
      - ${APPS_DATA_DIR:-./apps}/crm/local-storage:/app/packages/twenty-server/.local-storage
    ports:
      # loopback only: the tunnel (host network) and the dashboard reach it at 127.0.0.1:3020
      - "127.0.0.1:3020:3000"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:3000/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  twenty-worker:
    image: twentycrm/twenty:${TWENTY_TAG:-latest}
    container_name: homelab-twenty-worker
    restart: unless-stopped
    command: ["yarn", "worker:prod"]
    depends_on:
      postgres:
        condition: service_healthy
      twenty-server:
        condition: service_healthy
    environment:
      PG_DATABASE_URL: postgres://crm:${APP_CRM_DB_PASSWORD}@postgres:5432/crm
      SERVER_URL: https://crm.${PUBLIC_DOMAIN}
      REDIS_URL: redis://redis:6379
      ENCRYPTION_KEY: ${APP_CRM_ENCRYPTION_KEY}
      STORAGE_TYPE: local
      # migrations and cron registration already run on the server container
      DISABLE_DB_MIGRATIONS: "true"
      DISABLE_CRON_JOBS_REGISTRATION: "true"
      EMAIL_DRIVER: ${TWENTY_EMAIL_DRIVER:-}
      EMAIL_SMTP_HOST: ${TWENTY_EMAIL_SMTP_HOST:-}
      EMAIL_SMTP_PORT: ${TWENTY_EMAIL_SMTP_PORT:-}
      EMAIL_SMTP_USER: ${TWENTY_EMAIL_SMTP_USER:-}
      EMAIL_SMTP_PASSWORD: ${TWENTY_EMAIL_SMTP_PASSWORD:-}
      EMAIL_FROM_ADDRESS: ${TWENTY_EMAIL_FROM_ADDRESS:-}
      EMAIL_FROM_NAME: ${TWENTY_EMAIL_FROM_NAME:-Twenty CRM}
    volumes:
      - ${APPS_DATA_DIR:-./apps}/crm/local-storage:/app/packages/twenty-server/.local-storage

  # ---- Cloudflare Tunnel: outbound only, no router ports, TLS at Cloudflare's edge -------
  # Runs on the HOST network: a bridge container cannot reach services bound to 127.0.0.1 on
  # the host (host.docker.internal is the bridge gateway, not loopback), and everything this
  # tunnel publishes is loopback-only on purpose — the app Directuses now, the native dashboard
  # (127.0.0.1:3000) once issue #10's auth lands. cloudflared only dials out, so host mode costs
  # nothing in exposure; its own metrics listener stays on loopback too.
  # Hostname routing lives in Cloudflare Zero Trust → Networks → Tunnels → this tunnel →
  # Public Hostname: fam-api.<domain> → http://127.0.0.1:8056, ai-api.<domain> → http://127.0.0.1:8057
  # (later: dash.<domain> → http://127.0.0.1:3000). fam.<domain> / ai.<domain> are the apps'
  # front-ends (GitHub Pages) and are NOT tunnel hostnames.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: homelab-cloudflared
    restart: unless-stopped
    network_mode: host
    depends_on:
      - directus-fam
      - directus-ai
      - twenty-server
    # /ready and /metrics for the dashboard's tunnel status (CLOUDFLARED_METRICS_URL), loopback only
    command: tunnel --no-autoupdate --metrics 127.0.0.1:2000 run --token ${CLOUDFLARE_TUNNEL_TOKEN}
