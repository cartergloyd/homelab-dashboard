# Live stack: host publishes PostgreSQL exclusively at 127.0.0.1:5432.
# Local socket trust is confined to processes inside the PostgreSQL container
# (used by existing dump/restore jobs); no TCP connection uses trust.
local   all             all                                     trust
host    all             gold_admin      127.0.0.1/32            scram-sha-256
host    all             gold_admin      ::1/128                 scram-sha-256
# server-platform_default Docker bridge. Recheck subnet before reusing elsewhere.
host    all             gold_admin      172.20.0.0/16           scram-sha-256
host    fam             fam             172.20.0.0/16           scram-sha-256
host    ai              ai              172.20.0.0/16           scram-sha-256
host    all             all             0.0.0.0/0              reject
host    all             all             ::/0                   reject
